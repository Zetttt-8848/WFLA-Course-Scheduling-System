{% extends 'base.html' %}{% block content %}<h1>导入数据</h1><ol><li><a href="{{ url_for('template') }}">下载空白 Excel 模板</a>，按“说明”填写各表。</li><li>上传后先保存为独立草稿并校验；旧版本不会覆盖。</li><li>在校验页定位问题，通过网页逐行修改或重新上传。</li></ol><p>支持 .xlsx 和本系统 JSON 备份，最大10 MB。拒绝公式。每名学生六行选课，关联使用稳定编码。</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>数据文件 <input type="file" name="file" accept=".xlsx,.json" required></label><button>上传并校验</button></form>{% endblock %}
