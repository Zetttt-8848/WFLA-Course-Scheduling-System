{% extends 'base.html' %}{% block content %}<h1>{{ student.name }} 的六门选课</h1><p>{{ student.id }} · {{ student.grade }}年级。10年级不分层；11/12默认3 HL＋3 SL，4 HL需在“四门HL特批”表登记批准。</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="v" value="{{ v }}">{% for i in range(6) %}<label class="field">课程 {{ i+1 }}<select name="choice{{ i }}" required><option value="">请选择</option>{% for c in courses %}<option value="{{ c.id }}" {% if selected|length>i and selected[i]==c.id %}selected{% endif %}>{{ c.name }} · {{ '不分层' if c.level=='NONE' else c.level }} · {{ c.id }}</option>{% endfor %}</select></label>{% endfor %}<button>保存选课</button></form>{% endblock %}
